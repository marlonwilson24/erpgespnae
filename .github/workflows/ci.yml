name: ERP PNAE - CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    name: Build, Lint & Automated Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Código Fonte
        uses: actions/checkout@v4

      - name: Configurar Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar Dependências
        run: npm ci

      - name: Checagem Estática de Tipos (TypeScript tsc --noEmit)
        run: npm run lint

      - name: Executar Testes Automatizados (Vitest)
        run: npm run test

      - name: Validar Build de Produção
        run: npm run build
